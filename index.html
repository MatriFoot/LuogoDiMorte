<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luogo di Morte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=IM+Fell+English:ital@0;1&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment-base: #f5edd9;
      --parchment-dark: #d9c9ab;
      --parchment-light: #fffaf0;
      --ink: #3a2c1e;
      --ink-soft: #5d4b38;
      --accent: #8b7a61;
      --gold: #c9a567;
      --stone-dark: #191411;
      --stone-mid: #2d241e;
      --stone-light: #463b30;
      --shadow-deep: rgba(0, 0, 0, 0.85);
      --shadow-soft: rgba(0, 0, 0, 0.55);
      --candle-glow: rgba(255, 180, 90, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background-color: var(--stone-dark);
      background-image:
        /* Каменная стена с объёмом */
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,0.5) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(255,210,140,0.08) 0%, transparent 55%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 6px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 6px);
      font-family: 'IM Fell English', 'Cormorant Garamond', serif;
      color: var(--ink);
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      align-items: center;      /* Центрирование по горизонтали */
      justify-content: center; /* Центрирование по вертикали */
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Мягкий свет от свечей */
    .candle-glow {
      position: fixed;
      z-index: 90;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(25px);
      mix-blend-mode: screen;
    }
    .candle-glow.left {
      left: -60px; top: 12%;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(255,190,120,0.4) 0%, transparent 70%);
      animation: flickerLeft 6s ease-in-out infinite alternate;
    }
    .candle-glow.right {
      right: -60px; top: 10%;
      width: 240px; height: 240px;
      background: radial-gradient(circle, rgba(255,190,120,0.35) 0%, transparent 70%);
      animation: flickerRight 5s ease-in-out infinite alternate;
    }
    @keyframes flickerLeft {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.05); }
      100% { opacity: 0.75; transform: scale(1); }
    }
    @keyframes flickerRight {
      0% { opacity: 0.8; transform: scale(1.05); }
      50% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }

    /* Навигация */
    .nav {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .nav a {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      text-decoration: none;
      font-size: 1.3rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.6rem 1.4rem;
      border: 1px solid rgba(200,160,100,0.4);
      border-radius: 30px;
      background: rgba(30,25,20,0.7);
      transition: background 0.3s, color 0.3s, transform 0.3s;
    }
    .nav a:hover {
      background: rgba(200,160,100,0.3);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Основной лист пергамента */
    .manuscript {
      position: relative;
      z-index: 5;
      max-width: 700px;
      width: 100%;
      background: var(--parchment-base);
      padding: 3.5rem 3rem;
      border: 2px solid var(--accent);
      border-radius: 14px;
      box-shadow:
        0 25px 50px var(--shadow-deep),
        0 0 0 12px rgba(140,120,90,0.12),
        inset 0 0 60px rgba(120,100,70,0.35),
        inset 0 0 0 1px rgba(255,250,240,0.5);
      filter: sepia(0.15) contrast(1.05) brightness(0.95);
      text-align: center;
    }

    /* Текстура пергамента (многослойная) */
    .manuscript::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 14px;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(110,90,60,0.2) 0%, transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(110,90,60,0.15) 0%, transparent 30%),
        radial-gradient(circle at 70% 85%, rgba(110,90,60,0.2) 0%, transparent 35%),
        radial-gradient(circle at 25% 75%, rgba(110,90,60,0.12) 0%, transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(130,110,80,0.06) 0%, transparent 50%),
        repeating-linear-gradient(0deg, rgba(170,150,120,0.06) 0px, rgba(170,150,120,0.06) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg, rgba(170,150,120,0.05) 0px, rgba(170,150,120,0.05) 1px, transparent 1px, transparent 4px),
        repeating-linear-gradient(45deg, transparent 0px, transparent 12px, rgba(100,80,60,0.04) 12px, rgba(100,80,60,0.04) 13px),
        repeating-linear-gradient(-45deg, transparent 0px, transparent 18px, rgba(100,80,60,0.03) 18px, rgba(100,80,60,0.03) 19px);
      background-blend-mode: overlay, normal, normal, normal, normal, normal, normal, normal, normal;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: -1;
    }

    /* Лёгкая внешняя рамка */
    .manuscript::after {
      content: "";
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      border: 2px solid rgba(160,140,110,0.4);
      border-radius: 16px;
      pointer-events: none;
      z-index: -2;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    /* Орнаментальная рамка */
    .ornament {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      bottom: 16px;
      border: 1px solid rgba(180,160,130,0.5);
      pointer-events: none;
      z-index: 1;
    }
    .ornament::before,
    .ornament::after {
      content: "❦";
      position: absolute;
      font-size: 2.5rem;
      color: var(--gold);
      opacity: 0.7;
      top: 50%;
      transform: translateY(-50%);
    }
    .ornament::before { left: -20px; }
    .ornament::after { right: -20px; }

    /* Угловые элементы */
    .corner {
      position: absolute;
      width: 70px;
      height: 70px;
      border: 3px solid var(--gold);
      opacity: 0.85;
      z-index: 2;
    }
    .corner.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
    .corner.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
    .corner.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
    .corner.br { bottom: 10px; right: 10px; border-left: none; border-top: none; border-radius: 0 0 10px 0; }

    /* Чернильные кляксы */
    .ink-blot {
      position: absolute;
      width: 18px;
      height: 18px;
      background: rgba(60,40,25,0.5);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.25);
      pointer-events: none;
      z-index: 1;
    }
    .ink-blot.small { width: 10px; height: 10px; }
    .ink-blot.medium { width: 14px; height: 14px; }

    /* Заголовок */
    h1 {
      font-family: 'MedievalSharp', 'Cinzel', serif;
      font-size: 3.5rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 3;
    }
    h1::after {
      content: '';
      display: block;
      width: 120px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1rem auto 0;
      border-radius: 2px;
    }

    .subtitle {
      font-style: italic;
      color: var(--ink-soft);
      font-size: 1.3rem;
      margin-bottom: 2rem;
      position: relative;
      z-index: 3;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-top: 1rem;
      position: relative;
      z-index: 3;
    }
    .links a {
      font-family: 'Cinzel', serif;
      color: var(--ink);
      text-decoration: none;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.8rem 1.5rem;
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: rgba(255,250,240,0.6);
      transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
      display: block;
    }
    .links a:hover {
      background: rgba(200,160,100,0.3);
      transform: scale(1.03);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    @media (max-width: 768px) {
      .manuscript { padding: 2rem 1.2rem; }
      h1 { font-size: 2.4rem; }
      .links a { font-size: 1.2rem; padding: 0.6rem 1rem; }
      .nav a { font-size: 1rem; padding: 0.4rem 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- Свет от свечей -->
  <div class="candle-glow left"></div>
  <div class="candle-glow right"></div>

  <!-- Навигация -->
  <nav class="nav">
    <a href="rules.html">Правила</a>
    <a href="anketa.html">Анкета</a>
    <a href="rasy.html">Расы</a>
  </nav>

  <!-- Основной лист -->
  <div class="manuscript">
    <!-- Декоративные элементы -->
    <div class="ornament"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="ink-blot" style="top: 12%; left: 5%;"></div>
    <div class="ink-blot medium" style="bottom: 15%; right: 7%;"></div>
    <div class="ink-blot small" style="top: 45%; right: 10%;"></div>

    <h1>Luogo di Morte</h1>
    <p class="subtitle">Добро пожаловать в мир средневековых тайн</p>

    <div class="links">
      <a href="rules.html">Правила флуда</a>
      <a href="anketa.html">Анкета персонажа</a>
      <a href="rasy.html">Расы мира</a>
    </div>
  </div>

</body>
  </html>
