<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luogo di Morte</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=IM+Fell+English:ital@0;1&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background-color: #191411;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(255,255,255,0.04) 0%, transparent 35%),
        radial-gradient(circle at 85% 70%, rgba(0,0,0,0.45) 0%, transparent 45%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 5px);
      font-family: 'IM Fell English', 'Cormorant Garamond', serif;
      color: #3a2c1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .candle-glow {
      position: fixed; z-index: 90; pointer-events: none; border-radius: 50%;
      filter: blur(20px); mix-blend-mode: screen;
    }
    .candle-glow.left {
      left: -50px; top: 12%; width: 240px; height: 240px;
      background: radial-gradient(circle, rgba(255,190,120,0.35) 0%, transparent 70%);
      animation: flickerLeft 6s ease-in-out infinite alternate;
    }
    .candle-glow.right {
      right: -50px; top: 10%; width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(255,190,120,0.3) 0%, transparent 70%);
      animation: flickerRight 5s ease-in-out infinite alternate;
    }
    @keyframes flickerLeft {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.05); }
      100% { opacity: 0.75; transform: scale(1); }
    }
    @keyframes flickerRight {
      0% { opacity: 0.8; transform: scale(1.05); }
      50% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }
    .nav {
      position: relative; z-index: 10; display: flex; gap: 1.5rem;
      justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .nav a {
      font-family: 'Cinzel', serif; color: #c9a567; text-decoration: none;
      font-size: 1.3rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.5rem 1.2rem; border: 1px solid rgba(200,160,100,0.4);
      border-radius: 30px; background: rgba(30,25,20,0.7);
      transition: background 0.3s, color 0.3s;
    }
    .nav a:hover { background: rgba(200,160,100,0.3); color: #fff; }
    .manuscript {
      position: relative; z-index: 5; max-width: 600px; width: 100%;
      background: #f2eadb; padding: 3rem 2.5rem; border: 2px solid #8b7a61;
      border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8),
      inset 0 0 60px rgba(120,100,70,0.3);
      transform: rotate(-0.3deg); filter: sepia(0.15); text-align: center;
    }
    h1 {
      font-family: 'MedievalSharp', 'Cinzel', serif; font-size: 3rem;
      letter-spacing: 0.15em; text-transform: uppercase; color: #3a2c1e;
      margin-bottom: 2rem;
    }
    .links {
      display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem;
    }
    .links a {
      font-family: 'Cinzel', serif; color: #3a2c1e; text-decoration: none;
      font-size: 1.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 1rem 2rem; border: 2px solid #8b7a61; border-radius: 8px;
      background: rgba(255, 250, 240, 0.5); transition: background 0.3s, transform 0.3s;
    }
    .links a:hover { background: rgba(200,160,100,0.3); transform: scale(1.02); }
  </style>
</head>
<body>
  <div class="candle-glow left"></div>
  <div class="candle-glow right"></div>

  <nav class="nav">
    <a href="rules.html">Правила</a>
    <a href="anketa.html">Анкета</a>
    <a href="rasy.html">Расы</a>
  </nav>

  <div class="manuscript">
    <h1>Luogo di Morte</h1>
    <p style="font-style: italic; margin-bottom: 1rem;">Добро пожаловать в мир средневековых тайн</p>
    <div class="links">
      <a href="rules.html">Правила флуда</a>
      <a href="anketa.html">Анкета персонажа</a>
      <a href="rasy.html">Расы мира</a>
    </div>
  </div>
</body>
</html>
