<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luogo di Morte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=IM+Fell+English:ital@0;1&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment-base: #f5edd9;
      --parchment-dark: #d9c9ab;
      --ink: #3a2c1e;
      --ink-soft: #5d4b38;
      --accent: #8b7a61;
      --gold: #c9a567;
      --stone-dark: #191411;
      --shadow-deep: rgba(0, 0, 0, 0.8);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background-color: var(--stone-dark);
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,0.5) 0%, transparent 45%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 6px);
      font-family: 'IM Fell English', 'Cormorant Garamond', serif;
      color: var(--ink);
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Навигация */
    .nav {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .nav a {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      text-decoration: none;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(200,160,100,0.4);
      border-radius: 30px;
      background: rgba(30,25,20,0.7);
      transition: background 0.3s, color 0.3s;
    }
    .nav a:hover {
      background: rgba(200,160,100,0.3);
      color: #fff;
    }

    /* Основной лист */
    .manuscript {
      position: relative;
      z-index: 5;
      max-width: 700px;
      width: 100%;
      background: var(--parchment-base);
      padding: 3rem 2.5rem;
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 20px 40px var(--shadow-deep), inset 0 0 40px rgba(120,100,70,0.2);
      text-align: center;
    }

    /* Текстура пергамента */
    .manuscript::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 12px;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(110,90,60,0.15) 0%, transparent 20%),
        radial-gradient(circle at 90% 15%, rgba(110,90,60,0.1) 0%, transparent 25%),
        radial-gradient(circle at 70% 85%, rgba(110,90,60,0.12) 0%, transparent 30%),
        repeating-linear-gradient(0deg, rgba(170,150,120,0.05) 0px, rgba(170,150,120,0.05) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: -1;
    }

    /* Рамка */
    .ornament {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 1px solid rgba(180,160,130,0.4);
      pointer-events: none;
      z-index: 1;
    }

    /* Углы */
    .corner {
      position: absolute;
      width: 50px;
      height: 50px;
      border: 2px solid var(--gold);
      opacity: 0.6;
      z-index: 2;
    }
    .corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    /* Кляксы */
    .ink-blot {
      position: absolute;
      width: 14px;
      height: 14px;
      background: rgba(60,40,25,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
    .ink-blot.small { width: 8px; height: 8px; }
    .ink-blot.medium { width: 11px; height: 11px; }

    /* Заголовок */
    h1 {
      font-family: 'MedievalSharp', 'Cinzel', serif;
      font-size: 2.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 1.2rem;
      position: relative;
      z-index: 3;
    }
    h1::after {
      content: '';
      display: block;
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0.8rem auto 0;
      border-radius: 2px;
    }

    .subtitle {
      font-style: italic;
      color: var(--ink-soft);
      font-size: 1.2rem;
      margin-bottom: 2rem;
      position: relative;
      z-index: 3;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      z-index: 3;
    }
    .links a {
      font-family: 'Cinzel', serif;
      color: var(--ink);
      text-decoration: none;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.8rem 1.5rem;
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: rgba(255,250,240,0.6);
      transition: background 0.3s, transform 0.3s;
      display: block;
    }
    .links a:hover {
      background: rgba(200,160,100,0.3);
      transform: scale(1.03);
    }

    @media (max-width: 768px) {
      .manuscript { padding: 2rem 1.2rem; }
      h1 { font-size: 2.2rem; }
      .links a { font-size: 1.2rem; padding: 0.6rem 1rem; }
      .nav a { font-size: 0.9rem; padding: 0.4rem 0.6rem; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="rules.html">Правила</a>
    <a href="anketa.html">Анкета</a>
    <a href="rasy.html">Расы</a>
    <a href="contract.html">Контракт</a>
  </nav>

  <div class="manuscript">
    <div class="ornament"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="ink-blot" style="top: 10%; left: 4%;"></div>
    <div class="ink-blot medium" style="bottom: 12%; right: 6%;"></div>
    <div class="ink-blot small" style="top: 40%; right: 8%;"></div>

    <h1>Luogo di Morte</h1>
    <p class="subtitle">Добро пожаловать в мир средневековых тайн</p>

    <div class="links">
      <a href="rules.html">Правила флуда</a>
      <a href="anketa.html">Анкета персонажа</a>
      <a href="rasy.html">Расы мира</a>
      <a href="contract.html">Регламент межпроектного взаимодействия</a>
    </div>
  </div>

</body>
</html>
