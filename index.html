<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luogo di Morte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=IM+Fell+English:ital@0;1&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment-base: #f2eadb;
      --parchment-dark: #d8c9ae;
      --ink: #3a2c1e;
      --ink-soft: #5d4b38;
      --accent: #8b7a61;
      --gold: #c9a567;
      --stone-dark: #191411;
      --shadow-deep: rgba(0, 0, 0, 0.8);
      --candle-glow: rgba(255, 180, 90, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background-color: var(--stone-dark);
      background-image:
        radial-gradient(circle at 15% 25%, rgba(255,255,255,0.04) 0%, transparent 35%),
        radial-gradient(circle at 85% 70%, rgba(0,0,0,0.45) 0%, transparent 45%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 5px);
      font-family: 'IM Fell English', 'Cormorant Garamond', serif;
      color: var(--ink);
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* мягкий свет от свечей */
    .candle-glow {
      position: fixed;
      z-index: 90;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(20px);
      mix-blend-mode: screen;
    }
    .candle-glow.left {
      left: -50px; top: 12%;
      width: 240px; height: 240px;
      background: radial-gradient(circle, rgba(255,190,120,0.35) 0%, transparent 70%);
      animation: flickerLeft 6s ease-in-out infinite alternate;
    }
    .candle-glow.right {
      right: -50px; top: 10%;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(255,190,120,0.3) 0%, transparent 70%);
      animation: flickerRight 5s ease-in-out infinite alternate;
    }
    @keyframes flickerLeft {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.05); }
      100% { opacity: 0.75; transform: scale(1); }
    }
    @keyframes flickerRight {
      0% { opacity: 0.8; transform: scale(1.05); }
      50% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }

    /* навигация */
    .nav {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .nav a {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      text-decoration: none;
      font-size: 1.3rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.5rem 1.2rem;
      border: 1px solid rgba(200,160,100,0.4);
      border-radius: 30px;
      background: rgba(30,25,20,0.7);
      transition: background 0.3s, color 0.3s;
    }
    .nav a:hover {
      background: rgba(200,160,100,0.3);
      color: #fff;
    }

    /* основной лист */
    .manuscript {
      position: relative;
      z-index: 5;
      max-width: 920px;
      width: 100%;
      background: var(--parchment-base);
      padding: 3rem 2.5rem;
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 20px 40px var(--shadow-deep), inset 0 0 60px rgba(120,100,70,0.3);
      transform: rotate(-0.3deg);
      filter: sepia(0.15);
    }

    /* лёгкая текстура пергамента */
    .manuscript::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 12px;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(110,90,60,0.15) 0%, transparent 20%),
        radial-gradient(circle at 90% 15%, rgba(110,90,60,0.1) 0%, transparent 25%),
        radial-gradient(circle at 70% 85%, rgba(110,90,60,0.12) 0%, transparent 30%),
        repeating-linear-gradient(0deg, rgba(160,140,110,0.05) 0px, rgba(160,140,110,0.05) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg, rgba(160,140,110,0.04) 0px, rgba(160,140,110,0.04) 1px, transparent 1px, transparent 4px);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: -1;
    }

    /* рваные края */
    .manuscript::after {
      content: "";
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px solid rgba(160,140,110,0.3);
      border-radius: 14px;
      pointer-events: none;
      z-index: -2;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      clip-path: polygon(0% 2%, 5% 1%, 10% 3%, 20% 0%, 30% 2%, 45% 1%, 60% 3%, 75% 0%, 90% 2%, 100% 1%, 100% 98%, 90% 99%, 75% 97%, 60% 100%, 45% 98%, 30% 99%, 20% 97%, 10% 100%, 5% 98%, 0% 99%);
    }

    /* заголовки */
    h1, h2 {
      font-family: 'MedievalSharp', 'Cinzel', serif;
      text-transform: uppercase;
      color: var(--ink);
      text-align: center;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.8rem;
      letter-spacing: 0.15em;
      padding-bottom: 0.5em;
      border-bottom: 2px solid var(--accent);
    }
    h2 {
      font-size: 2rem;
      letter-spacing: 0.1em;
      margin-top: 2.5rem;
      margin-bottom: 1.5rem;
    }
    .part-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      letter-spacing: 0.2em;
      text-align: center;
      color: var(--ink-soft);
      margin: 2rem 0 1rem;
    }
    .rule-title {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      border-left: 4px solid var(--accent);
      padding-left: 1rem;
      margin: 1.8rem 0 0.8rem;
    }

    p, li {
      font-size: 1.15rem;
      margin-bottom: 0.8rem;
    }
    ul {
      margin-left: 2rem;
      list-style: none;
    }
    ul li::before {
      content: '◆';
      color: var(--accent);
      margin-right: 0.5rem;
    }

    .important-box {
      background: rgba(120,100,70,0.15);
      border: 2px solid var(--accent);
      padding: 1.5rem;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 2rem 0;
      text-transform: uppercase;
    }

    .drop-cap::first-letter {
      font-family: 'Cinzel', serif;
      font-size: 4rem;
      float: left;
      line-height: 0.8;
      padding-right: 10px;
      color: var(--accent);
    }

    .field {
      margin-bottom: 1.5rem;
    }
    .field-label {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      border-bottom: 1px dashed var(--accent);
      display: inline-block;
      margin-bottom: 0.3rem;
    }
    .field-desc {
      font-style: italic;
      color: var(--ink-soft);
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      .manuscript { padding: 2rem 1.2rem; }
      h1 { font-size: 2rem; }
      h2 { font-size: 1.6rem; }
      .nav a { font-size: 1rem; padding: 0.3rem 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- свет от свечей -->
  <div class="candle-glow left"></div>
  <div class="candle-glow right"></div>

  <!-- навигация -->
  <nav class="nav">
    <a href="rules.html">Правила</a>
    <a href="anketa.html">Анкета</a>
    <a href="rasy.html">Расы</a>
  </nav>

  <div class="manuscript">
    <h1>Luogo di Morte</h1>
    <p style="text-align:center; font-style: italic;">Добро пожаловать в мир средневековых тайн</p>
  </div>

</body>
  </html>
